
[package]
description = "Behavior, interaction, and infrastructure foundations for GPUI applications."
keywords = ["desktop", "gpui", "ui", "foundation"]
license = "Apache-2.0"
name = "gpui-base"
exclude = ["examples/"]
repository = "https://github.com/longbridge/gpui-kit"
homepage = "https://gpui-kit.com"
documentation = "https://docs.rs/gpui-base"
version = "0.8.0"
publish = false
edition = "2024"
autoexamples = false
autobenches = false

[lib]
doctest = false

[features]
gpui-fast = ["dep:gpui-fast"]
decimal = ["dep:rust_decimal"]
test-support = ["gpui/test-support", "gpui-fast?/test-support"]
inspector = ["gpui_macros/inspector", "gpui/inspector", "gpui-fast?/inspector"]

[dependencies]
aho-corasick = "1.1.3"
chrono = "0.4.38"
data-url = "0.3"
futures = "0.3"
itertools = "0.13.0"
html5ever = "0.27"
markup5ever_rcdom = "0.3.0"
num-traits = "0.2"
regex = "1"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.12.0"
web-time = "1"

[dependencies.anyhow]
version = "1"

[dependencies.gpui]
package = "gpui-pre"
version = "=0.3.9"

[dependencies.gpui-fast]
package = "gpui-fast"
version = "=0.1.10"
features = ["windows-manifest-provided-by-host"]
optional = true

[dependencies.gpui_macros]
package = "gpui-pre-macros"
version = "=0.3.9"

[dependencies.instant]
version = "0.1"
features = ["wasm-bindgen"]

[dependencies.lsp-types]
version = "0.97.0"
features = ["proposed"]

[dependencies.markdown]
version = "1.0.0"
features = ["serde"]

[dependencies.ropey]
version = "=2.0.0-beta.1"
features = ["metric_chars", "metric_lines_lf", "metric_utf16"]

[dependencies.rust_decimal]
version = "1.37.0"
optional = true

[dependencies.schemars]
version = "1"

[dependencies.serde]
version = "1.0.219"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.smallvec]
version = "1"

[dependencies.sum-tree]
package = "gpui-pre-sum-tree"
version = "=0.3.9"

[dependencies.tracing]
version = "0.1.41"

[target]

[target."cfg(not(target_family = \"wasm\"))"]

[target."cfg(not(target_family = \"wasm\"))".dependencies]

[target."cfg(not(target_family = \"wasm\"))".dependencies.smol]
version = "2"

[target."cfg(target_family = \"wasm\")"]

[target."cfg(target_family = \"wasm\")".dependencies]
async-channel = "2.3.1"

[target."cfg(target_os = \"macos\")"]

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"

[target."cfg(target_os = \"macos\")".dependencies.raw-window-handle]
version = "0.6.2"

[target."cfg(target_os = \"macos\")".dependencies.objc2-app-kit]
version = "0.3"
features = ["NSAccessibility", "NSView", "NSWindow", "NSWorkspace"]

[target."cfg(target_os = \"macos\")".dependencies.objc2-foundation]
version = "0.3"
features = ["NSGeometry", "NSString"]

[target."cfg(target_os = \"windows\")"]

[target."cfg(target_os = \"windows\")".dependencies]

[target."cfg(target_os = \"windows\")".dependencies.windows]
features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"]
version = "0.58.0"

[target."cfg(target_os = \"linux\")"]

[target."cfg(target_os = \"linux\")".dependencies]

[target."cfg(target_os = \"linux\")".dependencies.ashpd]
version = "0.13"
default-features = false
features = ["async-io", "settings"]

[dev-dependencies]
indoc = "2"
async-io = "2"

[dev-dependencies.gpui]
package = "gpui-pre"
version = "=0.3.9"
features = ["test-support"]

[dev-dependencies.gpui-fast]
package = "gpui-fast"
version = "=0.1.10"
features = ["windows-manifest-provided-by-host", "test-support"]

[dev-dependencies.gpui_platform]
package = "gpui-pre-platform"
version = "=0.3.9"
features = ["font-kit", "x11", "wayland", "runtime_shaders"]

[dev-dependencies.gpui-fast-platform]
package = "gpui-fast-platform"
version = "=0.1.10"
features = ["font-kit", "x11", "wayland", "runtime_shaders"]

[dev-dependencies.reqwest_client]
package = "gpui-pre-reqwest-client"
version = "=0.3.9"

[lints]

[lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
todo = "deny"
type_complexity = "allow"
useless_conversion = "allow"

[lints.clippy.style]
level = "allow"
priority = -1
