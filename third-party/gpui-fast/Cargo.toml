[workspace]
resolver = "2"
members = ["crates/gpui", "crates/gpui_macos", "crates/gpui_windows", "crates/gpui_linux", "crates/scheduler"]

# Standalone native tests use the same adapted owners as the application.
[patch.crates-io]
gpui-fast = { path = "crates/gpui" }
gpui-fast-macos = { path = "crates/gpui_macos" }
gpui-fast-windows = { path = "crates/gpui_windows" }
gpui-fast-linux = { path = "crates/gpui_linux" }
gpui-pre-scheduler = { path = "crates/scheduler" }
async-io = { path = "../async-io" }

[profile.dev]
debug = "line-tables-only"
